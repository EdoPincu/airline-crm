<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Skyline CRM</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="form" novalidate>
      <div class="brand">
        <div class="brand-mark">✈</div>
        <div><div class="brand-name">Skyline CRM</div><div class="brand-sub">Airline operations</div></div>
      </div>
      <h1>Sign in</h1>
      <p class="sub">Staff access to flights, customers and orders.</p>

      <div id="alert" hidden></div>

      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>

      <button class="btn btn-primary auth-submit" id="submit">Sign in</button>
      <p class="auth-alt">No account yet? <a href="signup.html">Request access</a></p>
    </form>
  </div>
  <script src="config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
