<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request access — Skyline CRM</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="form" novalidate>
      <div class="brand">
        <div class="brand-mark">✈</div>
        <div><div class="brand-name">Skyline CRM</div><div class="brand-sub">Airline operations</div></div>
      </div>
      <h1>Request access</h1>
      <p class="sub">New accounts start with no access until an administrator approves them.</p>

      <div id="alert" hidden></div>

      <div class="field">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" required autocomplete="name" autofocus>
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8">
        <div class="hint" id="strength">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password">
      </div>

      <button class="btn btn-primary auth-submit" id="submit">Create account</button>
      <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </form>
  </div>
  <script src="config.js"></script>
  <script type="module" src="signup.js"></script>
</body>
</html>
